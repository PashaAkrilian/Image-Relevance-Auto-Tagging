# Evaluator manifest (brief section 11 "Required files at submission").
name: flyrank-capstone-image-relevance
track: backend
capstone: ai-image-understanding-content-matching-engine

run: docker compose up --build
seed: docker compose exec app python -m scripts.seed_corpus
test: docker compose exec app pytest -q

base_url: http://localhost:8000

endpoints:
  - method: GET
    path: /health
  - method: GET
    path: /images
  - method: POST
    path: /images/batch/classify
  - method: POST
    path: /images/batch/embed
  - method: GET
    path: /posts
  - method: POST
    path: /posts/batch/embed
  - method: POST
    path: /posts/batch/match
  - method: GET
    path: /posts/{id}/images
  - method: GET
    path: /review/pending
  - method: GET
    path: /review/suggestions/{id}
  - method: POST
    path: /review/suggestions/{id}/decision
  - method: GET
    path: /batch/jobs
  - method: GET
    path: /costs/summary
